# Deploy on UGOS Pro: Docker -> Project -> Create, pointed at this folder.
#
# There is deliberately no `ports:` block. cloudflared reaches the app over the
# internal compose network, so nothing is published to the LAN and nothing is
# opened on the router — the tunnel is the only route in.
#
# That route is intentionally public: no Cloudflare Access, no login. See the
# "What public means here" and "Locking it down later" sections of DEPLOY.md
# for what that exposes and how to change it without redeploying.

services:
  app:
    build: .
    image: stock-monitor:latest
    container_name: stock-monitor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      STOCK_MONITOR_DB: /app/data/stocks.db
      STOCK_MONITOR_PYTHON: /opt/venv/bin/python
      # The SEC 403s any request without a real contact address in the
      # User-Agent, and the failure looks like a network problem.
      SEC_CONTACT: ${SEC_CONTACT:?set SEC_CONTACT in .env}
      DAILY_CRON: ${DAILY_CRON:-0 6 * * *}
    volumes:
      # Everything stateful lives here: stocks.db, the EDGAR cache, run logs.
      # Must exist and be writable before first start.
      - ${DATA_DIR:-/volume1/docker/stock-monitor/data}:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stock-monitor-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      # Hold the tunnel down until the app actually serves a page, so a broken
      # deploy shows as an unreachable hostname rather than a 502 you have to
      # go digging for.
      app:
        condition: service_healthy
